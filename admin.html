<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest Editor · Fishing For Islands</title>
<style>
  :root {
    --bg: #1a1a24;
    --panel: #22222e;
    --panel-hi: #2c2c3a;
    --border: #3a3a4a;
    --text: #e0e0e6;
    --muted: #8a8a96;
    --accent: #f0e68c;
    --accent-blue: #7cb3d4;
    --danger: #cc6666;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  a { color: var(--accent-blue); }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); }
  header .version { color: var(--muted); font-family: ui-monospace, monospace; }
  header .spacer { flex: 1; }
  header button, header a {
    background: var(--panel-hi); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 10px; cursor: pointer; font-size: 12px;
    text-decoration: none;
  }
  header button:hover, header a:hover { border-color: var(--accent); }
  header button.primary { border-color: var(--accent); color: var(--accent); }

  main {
    display: flex; height: calc(100vh - 47px);
  }
  #quest-list-panel {
    width: 280px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    background: var(--panel);
  }
  #quest-search {
    margin: 10px; padding: 6px 8px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    font-size: 12px;
  }
  #quest-list {
    list-style: none; margin: 0; padding: 0;
    overflow-y: auto; flex: 1;
  }
  #quest-list li {
    padding: 8px 12px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  #quest-list li:hover { background: var(--panel-hi); }
  #quest-list li.active { background: var(--panel-hi); border-left: 3px solid var(--accent); padding-left: 9px; }
  #quest-list li.dirty::after { content: ' •'; color: var(--accent); }
  #quest-list li .qid { color: var(--muted); font-family: ui-monospace, monospace; display: block; font-size: 10px; margin-top: 2px; }

  #quest-detail {
    flex: 1; overflow-y: auto;
    padding: 16px 24px;
  }
  #quest-detail.empty {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; color: var(--muted);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .field input[type="text"], .field textarea, .field input[type="number"], .field select {
    width: 100%; padding: 6px 8px; font-size: 13px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: inherit;
  }
  .field textarea {
    resize: vertical; min-height: 60px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
  }
  .field.row { display: flex; gap: 12px; }
  .field.row > div { flex: 1; }

  .chips {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 4px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px;
    min-height: 32px;
  }
  .chip {
    background: var(--panel-hi); color: var(--text);
    padding: 3px 8px; border-radius: 12px; font-size: 11px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip .remove {
    cursor: pointer; color: var(--muted);
    width: 14px; height: 14px; line-height: 14px;
    text-align: center; border-radius: 50%;
  }
  .chip .remove:hover { background: var(--danger); color: white; }
  .chips-add {
    background: transparent; border: 1px dashed var(--border);
    color: var(--muted); padding: 2px 6px; border-radius: 10px;
    cursor: pointer; font-size: 11px;
  }
  .chips-add:hover { border-color: var(--accent); color: var(--accent); }

  .step {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px; margin-bottom: 8px;
  }
  .step-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .step-head input { flex: 1; }
  .step .check-label { color: var(--muted); font-size: 10px; text-transform: uppercase; margin-top: 6px; }
  .step textarea { margin-top: 2px; }
  .step .controls { display: flex; gap: 4px; }
  .step button { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 11px; }
  .step button:hover { color: var(--accent); border-color: var(--accent); }
  .step button.danger:hover { color: var(--danger); border-color: var(--danger); }

  .add-step {
    background: transparent; border: 1px dashed var(--border);
    color: var(--muted); padding: 6px; border-radius: 4px;
    cursor: pointer; font-size: 12px; width: 100%;
  }
  .add-step:hover { border-color: var(--accent); color: var(--accent); }

  .section-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--accent); margin: 20px 0 8px;
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }

  .meta-flags { display: flex; gap: 16px; font-size: 12px; }
  .meta-flags label { display: flex; align-items: center; gap: 4px; color: var(--text); cursor: pointer; }

  #quest-detail .id-field {
    font-family: ui-monospace, monospace;
    font-size: 14px; color: var(--accent);
    margin-bottom: 4px;
  }

  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--panel); color: var(--text);
    padding: 10px 14px; border-radius: 4px;
    border: 1px solid var(--accent);
    display: none;
    font-size: 12px;
  }

  .dialog-picker {
    display: flex; gap: 6px; align-items: center;
  }
  .dialog-picker select { flex: 1; }
</style>
</head>
<body>
  <header>
    <h1>Quest Editor</h1>
    <span class="version" id="admin-version"></span>
    <div class="spacer"></div>
    <button id="admin-new">+ New Quest</button>
    <button id="admin-delete">Delete</button>
    <button id="admin-apply" class="primary" title="Save to localStorage so the game sees edits on next reload">Apply to Game</button>
    <button id="admin-clear-override" title="Remove localStorage override; revert to code-defined quests">Clear Override</button>
    <span id="admin-override-status" style="font-size:11px; color: var(--muted); margin-left: 4px;"></span>
    <button id="admin-copy">Copy JS</button>
    <button id="admin-export-js">Export .js</button>
    <button id="admin-export-json">Export .json</button>
    <a href="./">← Back to Game</a>
  </header>
  <main>
    <aside id="quest-list-panel">
      <input id="quest-search" type="search" placeholder="Search quests, islands, steps..." />
      <ul id="quest-list"></ul>
    </aside>
    <section id="quest-detail" class="empty">
      <div>Select a quest to edit, or create a new one.</div>
    </section>
  </main>
  <div id="toast"></div>
  <script type="module" src="./src/admin/main.js"></script>
</body>
</html>
